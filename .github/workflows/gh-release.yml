# 推 v* 标签时创建 GitHub Release。
# 正文由 git-cliff 按 cliff.toml 从提交生成 (与 CHANGELOG.md 同源);
# 不用 generate_release_notes: 它只统计合并的 PR, 本仓库直接 push 提交, 会生成空正文。
on:
  push:
    tags:
      - 'v*'

name: Create Release

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff 需要完整历史与上一个 tag

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: 💫 Release ${{ github.ref_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: false
