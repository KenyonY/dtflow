[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-transformer"
version = "0.1.0"
description = "A flexible data transformation tool for ML training formats (SFT, RLHF, Pretrain)"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
maintainers = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = [
    "machine-learning",
    "data-processing",
    "sft",
    "rlhf",
    "pretrain",
    "data-transformation",
    "nlp",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]

dependencies = [
    "numpy>=1.20.0",
    "tqdm>=4.60.0",
    "pyyaml>=5.4.0",
]

[project.optional-dependencies]
full = [
    "pandas>=1.3.0",
    "rich>=10.0.0",
    "scikit-learn>=0.24.0",
    "pyarrow",
    "jieba>=0.42.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "wordcloud>=1.8.0",
    "plotly>=5.0.0",
    "tqdm>=4.60.0",
]

storage = [
    "pandas>=1.3.0",
    "pyarrow",
]

display = [
    "rich>=10.0.0",
]

similarity = [
    "scikit-learn>=0.24.0",
]

analysis = [
    "jieba>=0.42.0",
    "scipy>=1.7.0",
    "scikit-learn>=0.24.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "wordcloud>=1.8.0",
    "plotly>=5.0.0",
    "tqdm>=4.60.0",
]

analysis-advanced = [
    "jieba>=0.42.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "wordcloud>=1.8.0",
    "plotly>=5.0.0",
    "tqdm>=4.60.0",
    "hdbscan>=0.8.0",
    "datasketch>=1.5.0",
    "umap-learn>=0.5.0",
    "bertopic>=0.15.0",
    "sentence-transformers>=2.2.0",
    "gensim>=4.0.0",  # for LDA
]

dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "isort>=5.9.0",
    "mypy>=0.910",
]

docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.0",
    "myst-parser>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/DataTransformer"
Documentation = "https://github.com/yourusername/DataTransformer#readme"
Repository = "https://github.com/yourusername/DataTransformer"
Issues = "https://github.com/yourusername/DataTransformer/issues"
Changelog = "https://github.com/yourusername/DataTransformer/blob/main/CHANGELOG.md"

# Hatchling build configuration
[tool.hatch.build.targets.wheel]
packages = ["data_transformer"]

[tool.hatch.build.targets.sdist]
include = [
    "/data_transformer",
    "/tests",
    "/examples",
    "/README.md",
    "/README_CN.md",
    "/QUICKSTART.md",
    "/ARCHITECTURE.md",
    "/PROJECT_SUMMARY.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/requirements.txt",
    "/pyproject.toml",
]

# Hatch environment configuration
[tool.hatch.envs.default]
dependencies = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=data_transformer --cov-report=term-missing {args:tests}"
cov-report = [
    "pytest --cov=data_transformer --cov-report=html {args:tests}",
    "python -m webbrowser htmlcov/index.html",
]

[tool.hatch.envs.lint]
detached = true
dependencies = [
    "black>=21.0",
    "flake8>=3.9.0",
    "isort>=5.9.0",
    "mypy>=0.910",
]

[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:data_transformer tests}"
style = [
    "flake8 {args:data_transformer tests}",
    "black --check --diff {args:data_transformer tests}",
    "isort --check-only --diff {args:data_transformer tests}",
]
fmt = [
    "isort {args:data_transformer tests}",
    "black {args:data_transformer tests}",
]
all = [
    "style",
    "typing",
]

[tool.hatch.envs.docs]
dependencies = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.0",
    "myst-parser>=0.15.0",
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -b html docs docs/_build"
serve = "python -m http.server --directory docs/_build"

# Black configuration
[tool.black]
line-length = 100
target-version = ["py37", "py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.direnv
  | \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/setup.py"]
known_first_party = ["data_transformer"]

# pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["data_transformer"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.paths]
data_transformer = ["data_transformer", "*/data-transformer/data_transformer"]
tests = ["tests", "*/data-transformer/tests"]

# MyPy configuration
[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "sklearn.*",
    "rich.*",
    "pyarrow.*",
]
ignore_missing_imports = true

# Ruff configuration (optional alternative to flake8)
[tool.ruff]
target-version = "py37"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.isort]
known-first-party = ["data_transformer"]
